services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cercle-citizen-developer-frontend-davide-carboni
    env_file: 
      - path: .env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped
